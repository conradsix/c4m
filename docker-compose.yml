services:
  postgres:
    image: postgres:18
    container_name: c4m-postgres
    environment:
      POSTGRES_DB: c4m
      POSTGRES_USER: c4m
      POSTGRES_PASSWORD: c4m
    ports:
      - "5433:5432"
    volumes:
      - c4m-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4m -d c4m"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  c4m-postgres-data:
